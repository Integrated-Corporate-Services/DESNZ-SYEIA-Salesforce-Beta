<template>
    <div class="page-shell">
        <template if:true={hasRecordId}>
            <template if:false={isLoaded}>
                <lightning-spinner alternative-text="Loading payment information" size="small"></lightning-spinner>
            </template>
            <template if:true={showContent}>
                <section class={sectionClass}>
                    <h2 class="slds-section__title">
                        <button
                            type="button"
                            class="slds-button slds-section__title-action section-title"
                            aria-expanded={isOpen}
                            aria-controls="payment-information-content"
                            onclick={toggleSection}>
                            <lightning-icon
                                icon-name={iconName}
                                size="x-small"
                                class="slds-section__title-action-icon slds-button__icon_left"
                                alternative-text="">
                            </lightning-icon>
                            <span class="slds-truncate" title="Payment Information">Payment Information</span>
                        </button>
                    </h2>
                    <template if:true={isOpen}>
                        <div id="payment-information-content" class="slds-section__content">
                            <div class="slds-grid slds-wrap">
                                <template for:each={caseDetails} for:item="field">
                                    <div key={field.key} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                        <div class="slds-form-element">
                                            <span class="slds-form-element__label">{field.label}</span>
                                            <div class="slds-form-element__control">
                                                <lightning-formatted-text value={field.value}></lightning-formatted-text>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <div class="slds-grid slds-wrap">
                                <template for:each={paymentDetails} for:item="field">
                                    <div key={field.key} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                        <div class="slds-form-element">
                                            <span class="slds-form-element__label">{field.label}</span>
                                            <div class="slds-form-element__control">
                                                <lightning-formatted-text value={field.value}></lightning-formatted-text>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </section>
            </template>
        </template>
        <template if:false={hasRecordId}>
            <p class="slds-p-around_medium" role="alert">The Case record ID is unavailable.</p>
        </template>
    </div>
</template>
