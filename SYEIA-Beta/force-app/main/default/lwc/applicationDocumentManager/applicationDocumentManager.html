<template>
    <lightning-card title="Applicant Files">

        <lightning-button
            label="Load Files"
            onclick={loadFiles}>
        </lightning-button>

        <template if:true={files}>
            <div class="slds-grid slds-wrap slds-m-top_medium">

                <template for:each={files} for:item="file">

                    <div key={file.name}
                         class="slds-col slds-size_1-of-2 slds-p-around_small">

                        <lightning-file-card
                            title={file.name}
                            description={file.sizeLabel}>
                        </lightning-file-card>
                    </div>

                </template>

            </div>
        </template>

    </lightning-card>
