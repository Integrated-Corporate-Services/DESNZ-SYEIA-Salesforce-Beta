<template>
    <div class={sectionClass}>
        <h3 class="slds-section__title">
            <button
                class="slds-button slds-section__title-action"
                aria-expanded={isOpen}
                aria-controls="fir-section-content"
                onclick={toggleSection}>
                <lightning-icon
                    icon-name="utility:switch"
                    size="x-small"
                    class="slds-section__title-action-icon slds-button__icon_left"
                    alternative-text="Toggle section">
                </lightning-icon>
                <span class="slds-truncate" title="Latest Further Information Requested">
                    Latest Further Information Requested
                </span>
            </button>
        </h3>

        <div class="slds-section__content" id="fir-section-content">
             
            <template lwc:if={isOpen}>
                <template lwc:if={firId}>

                    <!-- VIEW MODE -->
                    <template lwc:if={isViewMode}>
                        <lightning-record-view-form record-id={firId} object-api-name={objectApiName}>
                            <div class="slds-grid slds-wrap">
                                <template for:each={editableFields} for:item="field">
                                    <div key={field} class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                                        <div class="slds-grid slds-grid_vertical-align-end field-row">
                                            <div class="slds-col slds-grow">
                                                <lightning-output-field field-name={field}></lightning-output-field>
                                            </div>
                                            <lightning-button-icon
                                                icon-name="utility:edit"
                                                variant="bare"
                                                size="small"
                                                alternative-text="Edit"
                                                onclick={handleEdit}>
                                            </lightning-button-icon>
                                        </div>
                                    </div>
                                </template>

                                <!-- Read-only comment, right column, no pencil -->
                                <div class="slds-col slds-size_1-of-2"></div>
                                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                                    <div class="field-row">
                                        <lightning-output-field field-name={commentField}></lightning-output-field>
                                    </div>
                                </div>
                            </div>
                        </lightning-record-view-form>
                    </template>

                    <!-- EDIT MODE -->
                    <template lwc:else>
                        <lightning-record-edit-form
                            record-id={firId}
                            object-api-name={objectApiName}
                            onsuccess={handleSuccess}
                            onerror={handleError}>

                            <lightning-messages></lightning-messages>

                            <div class="slds-grid slds-wrap">
                                <template for:each={editableFields} for:item="field">
                                    <div key={field} class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                                        <lightning-input-field field-name={field}></lightning-input-field>
                                    </div>
                                </template>

                                <!-- Read-only comment, above the buttons -->
                                <div class="slds-col slds-size_1-of-2"></div>
                                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                                    <lightning-output-field field-name={commentField}></lightning-output-field>
                                </div>
                            </div>

                            <div class="slds-align_absolute-center slds-m-top_medium slds-m-bottom_small">
                                <lightning-button
                                    label="Cancel"
                                    class="slds-m-right_x-small"
                                    onclick={handleCancel}>
                                </lightning-button>
                                <lightning-button
                                    label="Save"
                                    variant="brand"
                                    type="submit">
                                </lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </template>

                </template>
                <template lwc:elseif={noRecord}>
                    <p class="slds-p-horizontal_small slds-text-color_weak">
                        No further information requests for this case.
                    </p>
                </template>
                <template lwc:elseif={errorMessage}>
                    <p class="slds-p-horizontal_small slds-text-color_error">{errorMessage}</p>
                </template>
                <template lwc:else>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
            </template>
        </div>
    </div>
</template>
