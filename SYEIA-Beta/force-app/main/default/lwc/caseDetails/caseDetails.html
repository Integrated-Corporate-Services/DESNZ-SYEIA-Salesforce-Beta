<template>
    <div class="page-shell">
        <template if:true={effectiveRecordId}>
            <template for:each={visibleSections} for:item="section">
                <template if:true={section.isObjectorComponent}>
                    <c-nwl-objector-details
                        key={section.name}
                        record-id={effectiveRecordId}>
                    </c-nwl-objector-details>
                </template>
                <template if:true={section.isLandComponent}>
                    <c-nwl-land-details
                        key={section.name}
                        record-id={effectiveRecordId}>
                    </c-nwl-land-details>
                </template>
                <template if:false={section.isChildComponent}>
                    <section key={section.name} class={section.sectionClass}>
                        <h2 class="slds-section__title">
                            <button
                                type="button"
                                class="slds-button slds-section__title-action section-title"
                                aria-expanded={section.isOpen}
                                aria-controls={section.contentId}
                                data-section-name={section.name}
                                onclick={toggleSection}>
                                <lightning-icon
                                    icon-name={section.iconName}
                                    size="x-small"
                                    class="slds-section__title-action-icon slds-button__icon_left"
                                    alternative-text="">
                                </lightning-icon>
                                <span class="slds-truncate" title={section.label}>
                                    {section.label}
                                </span>
                            </button>
                        </h2>
                        <template if:true={section.isOpen}>
                            <div id={section.contentId} class="slds-section__content">
                                <template if:true={section.hasFields}>
                                    <lightning-record-form
                                        record-id={effectiveRecordId}
                                        object-api-name="Case__c"
                                        fields={section.fields}
                                        mode="view"
                                        density="comfy"
                                        columns="2">
                                    </lightning-record-form>
                                </template>
                            </div>
                        </template>
                    </section>
                </template>
            </template>
        </template>
        <template if:false={effectiveRecordId}>
            <p class="slds-p-around_medium" role="alert">
                The Case record ID is unavailable.
            </p>
        </template>
    </div>
</template>
