<template>
    <div class="page-shell">
        <section class={objectorSectionClass}>
            <h2 class="slds-section__title">
                <button
                    type="button"
                    class="slds-button slds-section__title-action section-title"
                    aria-expanded={objectorOpen}
                    aria-controls="objector-content"
                    data-section="objector"
                    onclick={toggleSection}>
                    <lightning-icon
                        icon-name={objectorIconName}
                        size="x-small"
                        class="slds-section__title-action-icon slds-button__icon_left"
                        alternative-text="">
                    </lightning-icon>
                    <span class="slds-truncate" title="Objector Details">Objector Details</span>
                </button>
            </h2>
            <template if:true={objectorOpen}>
                <div id="objector-content" class="slds-section__content">
                    <div class="slds-grid slds-wrap">
                        <template for:each={objectorFields} for:item="field">
                            <div key={field.key} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                <div class="slds-form-element">
                                    <span class="slds-form-element__label">{field.label}</span>
                                    <div class="slds-form-element__control">
                                        <lightning-formatted-text value={field.value}></lightning-formatted-text>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template for:each={objectorCaseFields} for:item="field">
                            <div key={field.key} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                <div class="slds-form-element">
                                    <span class="slds-form-element__label">{field.label}</span>
                                    <div class="slds-form-element__control">
                                        <lightning-formatted-text value={field.value}></lightning-formatted-text>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </section>

        <template if:true={hasRepresentative}>
            <section class={representativeSectionClass}>
                <h2 class="slds-section__title">
                    <button
                        type="button"
                        class="slds-button slds-section__title-action section-title"
                        aria-expanded={representativeOpen}
                        aria-controls="representative-content"
                        data-section="representative"
                        onclick={toggleSection}>
                        <lightning-icon
                            icon-name={representativeIconName}
                            size="x-small"
                            class="slds-section__title-action-icon slds-button__icon_left"
                            alternative-text="">
                        </lightning-icon>
                        <span class="slds-truncate" title="Representative Details">Representative Details</span>
                    </button>
                </h2>
                <template if:true={representativeOpen}>
                    <div id="representative-content" class="slds-section__content">
                        <div class="slds-grid slds-wrap">
                            <template for:each={representativeFields} for:item="field">
                                <div key={field.key} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                    <div class="slds-form-element">
                                        <span class="slds-form-element__label">{field.label}</span>
                                        <div class="slds-form-element__control">
                                            <lightning-formatted-text value={field.value}></lightning-formatted-text>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </section>
        </template>

        <template if:true={hasLandowner}>
            <section class={landownerSectionClass}>
                <h2 class="slds-section__title">
                    <button
                        type="button"
                        class="slds-button slds-section__title-action section-title"
                        aria-expanded={landownerOpen}
                        aria-controls="landowner-content"
                        data-section="landowner"
                        onclick={toggleSection}>
                        <lightning-icon
                            icon-name={landownerIconName}
                            size="x-small"
                            class="slds-section__title-action-icon slds-button__icon_left"
                            alternative-text="">
                        </lightning-icon>
                        <span class="slds-truncate" title="Landowner Details">Landowner Details</span>
                    </button>
                </h2>
                <template if:true={landownerOpen}>
                    <div id="landowner-content" class="slds-section__content">
                        <div class="slds-grid slds-wrap">
                            <template for:each={landownerFields} for:item="field">
                                <div key={field.key} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                                    <div class="slds-form-element">
                                        <span class="slds-form-element__label">{field.label}</span>
                                        <div class="slds-form-element__control">
                                            <lightning-formatted-text value={field.value}></lightning-formatted-text>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </section>
        </template>
    </div>
</template>
