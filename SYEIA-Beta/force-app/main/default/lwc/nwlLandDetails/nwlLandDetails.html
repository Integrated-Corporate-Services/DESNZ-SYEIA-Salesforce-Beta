<template>
    <section class={sectionClass}>
        <h2 class="slds-section__title">
            <button
                type="button"
                class="slds-button slds-section__title-action section-title"
                aria-expanded={isOpen}
                aria-controls="land-details-content"
                onclick={toggleSection}>
                <lightning-icon
                    icon-name={iconName}
                    size="x-small"
                    class="slds-section__title-action-icon slds-button__icon_left"
                    alternative-text="">
                </lightning-icon>
                <span class="slds-truncate" title="Land Details">Land Details</span>
            </button>
        </h2>
        <template if:true={isOpen}>
            <div id="land-details-content" class="slds-section__content">
                <div class="slds-grid slds-wrap">
                    <template for:each={fields} for:item="field">
                        <div key={field.key} class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
                            <div class="slds-form-element">
                                <span class="slds-form-element__label">{field.label}</span>
                                <div class="slds-form-element__control">
                                    <lightning-formatted-text value={field.value}></lightning-formatted-text>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </section>
</template>
