name: validate

on:
  pull_request:
    branches:
      - develop
      - 'release/*'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
      SF_USERNAME_QA: ${{ secrets.SF_USERNAME_QA }}
      SF_USERNAME_UAT: ${{ secrets.SF_USERNAME_UAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (for PMD)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SF CLI
        run: |
          npm install --global @salesforce/cli

      - name: Install project deps (eslint, etc.)
        run: |
          npm ci || npm install

      - name: Install jq (JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Determine target environment (QA for develop, UAT for release/*)
        run: |
          if [[ "${{ github.base_ref }}" == release/* ]]; then
            echo "TARGET_ENV=UAT" >> $GITHUB_ENV
            echo "SF_USERNAME=${SF_USERNAME_UAT}" >> $GITHUB_ENV
            echo "ALIAS=UAT_SANDBOX" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=QA" >> $GITHUB_ENV
            echo "SF_USERNAME=${SF_USERNAME_QA}" >> $GITHUB_ENV
            echo "ALIAS=QA_SANDBOX" >> $GITHUB_ENV
          fi

      - name: Decode JWT key
        run: |
          echo "$SFDX_JWT_KEY" | base64 -d > server.key
          chmod 600 server.key

      - name: Authenticate with JWT
        run: |
          sf org login jwt --username "$SF_USERNAME" 
                           --client-id "$SF_CLIENT_ID" 
                           --jwt-key-file server.key 
                           --instance-url https://test.salesforce.com 
                           --alias "$ALIAS" --set-default

      - name: PMD (Apex)
        run: |
          ./scripts/pmd.sh

      - name: ESLint (LWC)
        run: |
          npx eslint "force-app/**/lwc/**/*.js"

      - name: Validate (checkonly) deploy to ${{ env.TARGET_ENV }}
        run: |
          mkdir -p deploy-results
          sf project deploy start 
            --manifest manifest/package.xml 
            --target-org "$ALIAS" 
            --test-level RunLocalTests 
            --ignore-errors 
            --wait 60 
            --dry-run 
            --json > deploy-results/checkonly.json
          cat deploy-results/checkonly.json | jq '.status,.result'

      - name: Run Apex tests (json) and compute org-wide coverage
        run: |
          mkdir -p test-results
          sfdx force:apex:test:run -u "$ALIAS" -l RunLocalTests -w 60 -c --json > test-results/apex.json
          cat test-results/apex.json | jq '.result.summary'
          ORG_COV=$(jq -r '.result.summary.orgWideCoverage' test-results/apex.json)
          echo "ORG_COVERAGE=$ORG_COV" >> $GITHUB_ENV
          if [ "$ORG_COV" = "null" ]; then ORG_COV=0; fi
          echo "Org-wide coverage: $ORG_COV%"
          if (( $(printf "%.0f" "$ORG_COV") < 75 )); then
            echo "Coverage below 75%"; exit 1;
          fi
          FAILURES=$(jq -r '.result.summary.failing' test-results/apex.json)
          if (( FAILURES > 0 )); then
            echo "There are failing tests"; exit 1;
          fi

      - name: Post summary to PR
        if: always()
        run: |
          {
            echo "### Validation Summary"
            echo ""
            echo "- Target: **${{ env.TARGET_ENV }}**"
            echo "- Org-wide Coverage: **${{ env.ORG_COVERAGE }}%**"
            echo "- PMD & ESLint: Completed"
            echo "- Deployment: **checkonly**"
          } >> $GITHUB_STEP_SUMMARY






name: qa-deploy

on:
  push:
    branches: [ develop ]

permissions:
  contents: write

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    environment: QA
    env:
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
      SF_USERNAME_QA: ${{ secrets.SF_USERNAME_QA }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SF CLI and jq
        run: |
          npm install --global @salesforce/cli
          sudo apt-get update && sudo apt-get install -y jq

      - name: Decode JWT key
        run: |
          echo "$SFDX_JWT_KEY" | base64 -d > server.key
          chmod 600 server.key

      - name: Authenticate QA
        run: |
          sf org login jwt --username "$SF_USERNAME_QA" \
                           --client-id "$SF_CLIENT_ID" \
                           --jwt-key-file server.key \
                           --instance-url https://test.salesforce.com \
                           --alias QA_SANDBOX --set-default

      - name: Validate (checkonly)
        run: |
          sf project deploy start --manifest manifest/package.xml 
            --target-org QA_SANDBOX --test-level RunLocalTests 
            --wait 60 --dry-run --json > deploy-results-qa-check.json
          cat deploy-results-qa-check.json | jq '.status,.result'

      - name: Deploy (real)
        run: |
          sf project deploy start --manifest manifest/package.xml \
            --target-org QA_SANDBOX --test-level RunLocalTests \
            --wait 60 --json > deploy-results-qa.json
          cat deploy-results-qa.json | jq '.status,.result'

      - name: Run all tests
        run: |
          mkdir -p test-results
          sfdx force:apex:test:run -u QA_SANDBOX -l RunLocalTests -w 60 -c --json > test-results/apex.json
          ORG_COV=$(jq -r '.result.summary.orgWideCoverage' test-results/apex.json)
          echo "Org-wide coverage: $ORG_COV%" >> $GITHUB_STEP_SUMMARY
          FAILURES=$(jq -r '.result.summary.failing' test-results/apex.json)
          if (( FAILURES > 0 )); then
            echo "There are failing tests"; exit 1;
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-deploy-artifacts
          path: |
            deploy-results-qa.json
            test-results/apex.json

      - name: Create QA tag
        run: |
          SHORTSHA=$(git rev-parse --short HEAD)
          TAG="qa-$(date +%Y%m%d)-$SHORTSHA"
          git tag -a "$TAG" -m "QA deploy $TAG"
          git push origin "$TAG"
          echo "Created tag $TAG" >> $GITHUB_STEP_SUMMARY
