name: "Pipeline: auth check"

# For a public repository only: the same button as the private-repo template, but the
# run happens in CoE-DevOps, through pipeline-external.yml. Must sit on this repo's
# default branch or the Run workflow button will not appear.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Org(s) to check - blank checks all of them"
        required: false
        default: ""
        type: string

  # EDIT ME: uncomment to check every org weekly. A certificate that expires is otherwise
  # found by a production release failing, which is the worst moment to learn about it.
  # schedule:
  #   - cron: "0 7 * * 1"

permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline-external.yml
    with:
      flow: auth-check
      flow_inputs: ${{ toJSON(inputs) }}
    secrets: inherit
