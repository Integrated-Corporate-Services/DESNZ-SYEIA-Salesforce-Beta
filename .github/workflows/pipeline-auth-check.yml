name: "Pipeline: auth check"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Org(s) to check - blank checks all of them"
        required: false
        default: ""
        type: string


permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline-external.yml
    with:
      flow: auth-check
      flow_inputs: ${{ toJSON(inputs) }}
    secrets: inherit
