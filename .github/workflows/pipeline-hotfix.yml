name: "Pipeline: hotfix"

# Must sit on this repo's default branch or the Run workflow button will not
# appear - a GitHub rule for manually dispatched workflows.
on:
  workflow_dispatch:
    inputs:
      hotfix_branch:
        description: "Branch to Deploy"
        required: true
        type: string
      environment:
        description: "Org(s) to deploy to - comma-separated"
        required: true
        type: string
      base_branch:
        description: "Compare against"
        required: false
        default: main
        type: string

jobs:
  pipeline:
    uses: Integrated-Corporate-Services/CoE-DevOps/.github/workflows/stage-hotfix.yml@main
    with:
      hotfix_branch: ${{ inputs.hotfix_branch }}
      environment: ${{ inputs.environment }}
      base_branch: ${{ inputs.base_branch }}
      # EDIT ME - see pipeline-pr.yml
      source_path: SYEIA-Beta/force-app/main/default
      upload_sarif: "false"
    secrets: inherit
