name: "Pipeline: manual regression"

# Must sit on the default branch to be runnable.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Org to test against"
        required: true
        type: string
      apex_test_suites:
        description: "Apex suites (blank = stage setting, 'default' = all local tests)"
        required: false
        default: ""
        type: string

jobs:
  pipeline:
    uses: Integrated-Corporate-Services/CoE-DevOps/.github/workflows/stage-manual-regression.yml@main
    with:
      environment: ${{ inputs.environment }}
      apex_test_suites: ${{ inputs.apex_test_suites }}
    secrets: inherit
