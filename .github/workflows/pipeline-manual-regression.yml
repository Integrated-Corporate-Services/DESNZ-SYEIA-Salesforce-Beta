name: "Pipeline: manual regression"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Org to test against"
        required: true
        type: string
      apex_test_suites:
        description: "Apex suites (blank = stage setting, 'default' = all local tests)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    uses: ./.github/workflows/pipeline-external.yml
    with:
      flow: manual-regression
      flow_inputs: ${{ toJSON(inputs) }}
    secrets: inherit
