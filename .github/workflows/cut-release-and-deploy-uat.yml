name: cut-release-and-deploy-uat

on:
  workflow_dispatch:  
    inputs:
      version:
        description: 'Release version (e.g., 1.3.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create release branch from develop (if not exists)
        run: |
          VER="${{ inputs.version }}"
          BRANCH="release/${VER}"

          git fetch origin

          # Check if the release branch already exists remotely
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "Branch $BRANCH already exists — skipping creation."
          else
            echo "Creating new release branch $BRANCH from develop."
            git checkout -b "$BRANCH" origin/develop
            git push -u origin "$BRANCH"
          fi

      - name: Open PR to main (idempotent)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          VER="${{ inputs.version }}"
          BRANCH="release/${VER}"

          git fetch --all

          # Verify branch exists remotely
          if ! git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            echo "::error::Branch $BRANCH does not exist on remote."
            exit 1
          fi

          # Check for differences between main and release branch
          if git diff --quiet origin/main..origin/$BRANCH; then
            echo "::warning::No changes between main and $BRANCH — skipping PR creation."
            exit 0
          fi

          # Check if a PR already exists for this branch
          EXISTING_PR=$(gh pr list --base main --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists for $BRANCH — skipping creation."
            exit 0
          fi

           # Try to create PR; if already exists, skip gracefully
          gh pr create --base main --head "$BRANCH" \
            --title "Release ${VER}" \
            --body "Auto-generated PR to prepare ${VER} for production readiness." \
            || {
              echo "ℹ️ PR already exists for $BRANCH → main — skipping.";
              exit 0;
            }

          echo "✅ Created PR for $BRANCH → main"
