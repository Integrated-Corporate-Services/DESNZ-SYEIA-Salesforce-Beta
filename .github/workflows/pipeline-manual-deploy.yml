name: "Pipeline: manual deploy"

# The dropdowns live here because a called workflow cannot declare a choice input.
# Must sit on the default branch to be runnable.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Org(s) to deploy to - comma-separated"
        required: true
        type: string
      deploy_mode:
        description: "How to deploy"
        required: true
        default: delta
        type: choice
        options:
          - delta
          - full
      run_mode:
        description: "What this run should do"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - validate
      to_branch:
        description: "Branch to Deploy"
        required: true
        type: string
      base_branch:
        description: "Compare against (delta only - ignored for a full deploy)"
        required: false
        default: HEAD
        type: string

jobs:
  pipeline:
    uses: Integrated-Corporate-Services/CoE-DevOps/.github/workflows/stage-manual-deploy.yml@main
    with:
      environment: ${{ inputs.environment }}
      deploy_mode: ${{ inputs.deploy_mode }}
      run_mode: ${{ inputs.run_mode }}
      to_branch: ${{ inputs.to_branch }}
      base_branch: ${{ inputs.base_branch }}
      # EDIT ME - see pipeline-pr.yml
      source_path: SYEIA-Beta/force-app/main/default
      upload_sarif: "false"
    secrets: inherit
