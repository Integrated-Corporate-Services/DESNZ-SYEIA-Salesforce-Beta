name: "Pipeline: open promotion PR"

on:
  create:

permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')
    uses: ./.github/workflows/pipeline-external.yml
    with:
      flow: open-promotion-pr
      flow_inputs: '{"base_branch": "main", "draft": false}'
    secrets: inherit
