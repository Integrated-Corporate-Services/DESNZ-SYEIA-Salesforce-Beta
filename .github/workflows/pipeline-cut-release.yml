name: "Pipeline: open release PR"

# Cut a release branch and the pull request carrying it onwards opens by itself.

on:
  create:

permissions:
  contents: read

jobs:
  open-pr:

    if: >-
      github.event.ref_type == 'branch'
      && startsWith(github.event.ref, 'release/')
    uses: Integrated-Corporate-Services/CoE-DevOps/.github/workflows/stage-open-promotion-pr.yml@main
    with:
      head_branch: ${{ github.event.ref }}
      # EDIT ME: where a release branch promotes into.
      base_branch: main
      title: "Release ${{ github.event.ref }}"
      draft: false
    secrets: inherit
