# Every environment name must match a GitHub Environment in this repo, with
# SF_CONSUMER_KEY, SF_SERVER_KEY, SF_USERNAME and SF_INSTANCE_URL set on it.
# Approval environments need required reviewers set, otherwise the run just
# stops instead of deploying unapproved.
#
# Field reference
# ---------------
#   target_branch       Destination branch for this stage's PR or push.
#                       Required, unless the stage is dispatch-only
#                       (e.g. hotfix) and runs only via a workflow.
#
#   environments        List of orgs this stage deploys to.
#                       Required, except on a backsync-only stage.
#     - name              GitHub Environment name, also used as the org alias.
#     - gates             Optional list of gates for this environment
#                         (default: none). Each gate:
#                           trigger   pr | merge — pr gates run during PR
#                                     validation, merge gates during the
#                                     real deploy
#                           on        any_change | destructive_change —
#                                     deletions count as both
#                           level     require_approval (pause for a reviewer
#                                     in approval_environment) | warn (just
#                                     comment on the PR)
#                           approval_environment
#                                     GitHub Environment to pause on. Required
#                                     for require_approval, unused for warn.
#                         A stage can stack multiple gates per environment —
#                         e.g. a light approval on any_change plus a stricter
#                         one on destructive_change.
#
#   severity_threshold  Code Analyzer severity that fails the run: 1=Critical
#                       2=High 3=Medium 4=Low 5=Info. Higher number = stricter,
#                       "0" reports everything and fails nothing.
#                       (default: "2"). Applies to PR validation, hotfix, and
#                       manual deploy — the merge deploy doesn't re-scan since
#                       the PR already did. So a stage reached by pushing
#                       straight to its branch is never scanned; protect the
#                       branch if that matters.
#
#   test_level          Apex test level for validate and deploy:
#                       RunLocalTests | RunSpecifiedTests | NoTestRun
#                                                    (default: RunLocalTests)
#
#   regression          true | false — run Apex test suites after a
#                       successful deploy.                    (default: false)
#   apex_test_suites    Comma-separated suite names for regression. Blank or
#                       "default" runs all local tests.             (default: "")
#
#   backsync            After deploy, open a PR into each target. Either
#                       false (default) or:
#                         enabled: true | false
#                         targets:
#                           - branch: <branch>    # required
#                             repo: <org>/<repo>  # default: this repo
#                       Needs at least one target when enabled, and a
#                       FORK_PAT secret (repo scope) on each target — the
#                       pipeline's own token is read-only.
#

stages:
  # feature → develop (QA)

  feature-to-develop:
    target_branch: develop
    environments:
      - name: QA

  # develop → release/* (UAT, validation only)
  #
  # Merges into a release branch deploy nothing: pipeline-merge.yml ignores
  # release/**, so only the pull request into one is validated. The ignore uses **
  # where this uses *, deliberately - GitHub's * stops at a slash and so does this,
  # but release/release/... exists here, and ** is what catches it on both sides.

  develop-to-release:
    target_branch: "release/*"
    environments:
      - name: UAT

  # release → main (PROD)

  release-to-main:
    target_branch: main
    environments:
      - name: PROD
        gates:
          - trigger: merge
            on: any_change
            level: require_approval
            approval_environment: PROD-Approval

  # Hotfix (UAT)

  hotfix:
    environments:
      - name: UAT
    # A hotfix reaches UAT without passing through develop, so it has to be carried
    # back or it is lost at the next release. The PRs are labelled as hotfix
    # backsyncs and need review like any other.
    #
    # develop only. The old workflow also opened one into the newest release/*,
    # picked with `ls-remote | tail -n1`, which is alphabetical rather than newest -
    # targets here are branch names, so that cannot be reproduced and is better done
    # deliberately than guessed at.
    backsync:
      enabled: true
      targets:
        - branch: develop

  # Manual Deploy

  manual-deploy:
    environments:
      - name: DEV1
      - name: DEV2
      - name: QA
      - name: UAT
      - name: PROD
        gates:
          - trigger: merge
            on: any_change
            level: require_approval
            approval_environment: PROD-Approval

  # Manual Regression

  manual-regression:
    environments:
      - name: QA
      - name: UAT

